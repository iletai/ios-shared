# Reusable: build, upload binary + metadata, optionally screenshots and submit for review.
name: iOS App Store

on:
  workflow_call:
    inputs:
      scheme:
        description: Overrides SCHEME from fastlane/.env.default
        type: string
        default: ''
      xcode-version:
        type: string
        default: latest-stable
      ruby-version:
        type: string
        default: '3.3'
      submit:
        description: Submit for review after upload (needs explicit owner OK)
        type: boolean
        default: false
      skip-metadata:
        type: boolean
        default: false
      screenshots:
        description: Capture on simulator and upload screenshots
        type: boolean
        default: false
    secrets:
      APPLE_TEAM_ID:
        required: true
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_KEY_CONTENT_BASE64:
        required: true
      MATCH_GIT_URL:
        required: true
      MATCH_PASSWORD:
        required: true
      MATCH_SSH_KEY:
        required: true
      FASTLANE_KEYCHAIN_PASSWORD:
        required: true
      APP_REVIEW_FIRST_NAME:
        required: false
      APP_REVIEW_LAST_NAME:
        required: false
      APP_REVIEW_PHONE:
        required: false
      APP_REVIEW_EMAIL:
        required: false

jobs:
  release:
    name: Build & upload to App Store
    runs-on: macos-26
    timeout-minutes: 75
    environment: production
    concurrency:
      group: appstore-${{ github.repository }}
      cancel-in-progress: false
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Generate project
        if: hashFiles('project.yml') != ''
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Scheme override
        if: inputs.scheme != ''
        run: echo "SCHEME=$INPUT_SCHEME" >> "$GITHUB_ENV"
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
      - name: SSH for match repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_KEY }}
      # Before the release step: a submission without screenshots is rejected by ASC.
      - name: Screenshots
        if: inputs.screenshots
        run: bundle exec fastlane screenshots upload:true
      - name: Build, upload, submit=${{ inputs.submit }}
        run: bundle exec fastlane release submit:${{ inputs.submit }} skip_metadata:${{ inputs.skip-metadata }}
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.sha }}
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14
