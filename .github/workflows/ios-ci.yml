# Reusable: lint + tests. Caller: uses: iletai/ios-shared/.github/workflows/ios-ci.yml@main
name: iOS CI

on:
  workflow_call:
    inputs:
      scheme:
        description: Overrides TEST_SCHEME from fastlane/.env.default
        type: string
        default: ''
      xcode-version:
        type: string
        default: latest-stable
      ruby-version:
        type: string
        default: '3.3'
      xcconfig-secrets:
        description: Comma list of repo secret names written as NAME = value to xcconfig-secrets-path (empty ones skipped)
        type: string
        default: ''
      xcconfig-secrets-path:
        type: string
        default: Config/Secrets.xcconfig

jobs:
  test:
    name: Lint & Test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Install tooling
        run: |
          which xcodegen || brew install xcodegen
          which xcbeautify || brew install xcbeautify
      - name: SwiftLint
        if: hashFiles('.swiftlint.yml') != ''
        run: |
          which swiftlint || brew install swiftlint
          swiftlint --strict --quiet
      # Values come from the caller's secrets (secrets: inherit); never echoed.
      - name: Write secrets xcconfig
        if: inputs.xcconfig-secrets != ''
        env:
          NAMES: ${{ inputs.xcconfig-secrets }}
          XCCONFIG_PATH: ${{ inputs.xcconfig-secrets-path }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          ruby -rjson -e '
            all = JSON.parse(ENV["ALL_SECRETS"])
            lines = ENV["NAMES"].split(",").map(&:strip).filter_map { |n| v = all[n].to_s; "#{n} = #{v}" unless v.empty? }
            File.write(ENV["XCCONFIG_PATH"], lines.join("\n") + "\n") unless lines.empty?
            puts "Wrote #{lines.size} key(s) to #{ENV["XCCONFIG_PATH"]}"'
      - name: Generate project
        if: hashFiles('project.yml') != ''
        run: xcodegen generate
      - name: Scheme override
        if: inputs.scheme != ''
        run: echo "TEST_SCHEME=$INPUT_SCHEME" >> "$GITHUB_ENV"
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
      # xcbeautify drops Swift Testing failure lines: keep the raw log in test_output and print issues on failure.
      - name: Test
        run: |
          mkdir -p fastlane/test_output
          set -o pipefail && bundle exec fastlane test 2>&1 | tee fastlane/test_output/raw.log | xcbeautify --renderer github-actions
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      - name: Show test issues
        if: failure()
        run: grep -nE '✘|recorded an issue|error:|failed' fastlane/test_output/raw.log | tail -60 || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output
          retention-days: 7
