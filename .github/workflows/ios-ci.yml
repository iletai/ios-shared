# Reusable: lint + tests. Caller: uses: iletai/ios-shared/.github/workflows/ios-ci.yml@main
name: iOS CI

on:
  workflow_call:
    inputs:
      scheme:
        description: Overrides TEST_SCHEME from fastlane/.env.default
        type: string
        default: ''
      xcode-version:
        type: string
        default: latest-stable
      ruby-version:
        type: string
        default: '3.3'

jobs:
  test:
    name: Lint & Test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Install tooling
        run: |
          which xcodegen || brew install xcodegen
          which xcbeautify || brew install xcbeautify
      - name: SwiftLint
        if: hashFiles('.swiftlint.yml') != ''
        run: |
          which swiftlint || brew install swiftlint
          swiftlint --strict --quiet
      - name: Generate project
        if: hashFiles('project.yml') != ''
        run: xcodegen generate
      - name: Scheme override
        if: inputs.scheme != ''
        run: echo "TEST_SCHEME=$INPUT_SCHEME" >> "$GITHUB_ENV"
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
      # xcbeautify drops Swift Testing failure lines, so failures are also in test_output.
      - name: Test
        run: set -o pipefail && bundle exec fastlane test 2>&1 | xcbeautify --renderer github-actions
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output
          retention-days: 7
